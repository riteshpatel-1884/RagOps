[project]
name = "ragops-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.9",
    "pypdf==4.3.1",
    "qdrant-client==1.11.1",
    "scikit-learn==1.5.2",
    "numpy==1.26.4",
    "anthropic==0.34.2",
    "python-dotenv==1.0.1",
    "rank-bm25==0.2.2",
    "deepeval>=3.4.6",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.uv]
package = false
